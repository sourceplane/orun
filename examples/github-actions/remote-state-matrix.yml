# remote-state-matrix.yml
#
# Copyable workflow example: runs orun jobs in parallel GitHub Actions matrix
# workers coordinated through orun-backend remote state.
#
# Dependencies (e.g. api/web only after foundation) are enforced by the
# backend — each job polls until its deps complete, then claims work and
# executes.
#
# Required repository configuration:
#   vars.ORUN_BACKEND_URL  - URL of your orun-backend instance
#
# Authentication:
#   GitHub Actions OIDC (id-token: write) — the live backend uses OIDC JWT
#   verification. No static ORUN_TOKEN is needed for mutable operations.

name: remote-state-matrix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Compile plan
    runs-on: ubuntu-latest
    outputs:
      plan_id: ${{ steps.plan.outputs.plan_id }}
      run_id: ${{ steps.plan.outputs.run_id }}
      jobs: ${{ steps.matrix.outputs.jobs }}
      first_job: ${{ steps.matrix.outputs.first_job }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install orun
        run: go install ./cmd/orun

      - name: Compile plan
        id: plan
        working-directory: examples/remote-state-matrix
        run: |
          # The plan is published under its name, so later jobs run it as
          # `orun run remote-state-e2e`. The -o copy only supplies the checksum
          # that keeps run_id unique.
          orun plan --name remote-state-e2e --all -o "${RUNNER_TEMP}/remote-state-e2e.json"
          plan_id="$(jq -r '.metadata.checksum // empty | sub("^sha256-"; "") | .[0:12]' \
            "${RUNNER_TEMP}/remote-state-e2e.json")"
          test -n "${plan_id}"
          run_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${plan_id}"
          echo "plan_id=${plan_id}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Build job matrix
        id: matrix
        working-directory: examples/remote-state-matrix
        run: |
          jobs="$(orun get jobs --plan remote-state-e2e --all -o json \
            | jq -c '[.[] | {job: .id, env: .environment, component: .component}]')"
          first_job="$(printf '%s' "${jobs}" | jq -r '.[0].job')"
          # Append a duplicate entry to prove idempotent claim / already-complete behavior.
          jobs="$(printf '%s' "${jobs}" | jq -c --arg job "${first_job}" '. + [{job: $job, env: "duplicate", component: "duplicate"}]')"
          echo "jobs=${jobs}" >> "${GITHUB_OUTPUT}"
          echo "first_job=${first_job}" >> "${GITHUB_OUTPUT}"

      - name: Upload compiled plan
        uses: actions/upload-artifact@v4
        with:
          name: orun-remote-state-plan
          path: examples/remote-state-matrix/.orun/objectmodel/
          include-hidden-files: true
          if-no-files-found: error

  run-one-job-per-runner:
    name: "Run: ${{ matrix.job }}"
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.jobs) }}
    env:
      ORUN_BACKEND_URL: ${{ vars.ORUN_BACKEND_URL }}
      ORUN_REMOTE_STATE: "true"
      ORUN_EXEC_ID: ${{ needs.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install orun
        run: go install ./cmd/orun

      - name: Download compiled plan
        uses: actions/download-artifact@v4
        with:
          name: orun-remote-state-plan
          path: examples/remote-state-matrix/.orun/objectmodel/

      - name: Run selected job through remote state
        working-directory: examples/remote-state-matrix
        run: |
          orun run remote-state-e2e \
            --job '${{ matrix.job }}' \
            --remote-state \
            --backend-url "${ORUN_BACKEND_URL}" \
            --gha \
            --verbose

  run-env-fanout:
    name: "Env fanout: ${{ matrix.env_name }}"
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env_name: [dev, stage]
    env:
      ORUN_BACKEND_URL: ${{ vars.ORUN_BACKEND_URL }}
      ORUN_REMOTE_STATE: "true"
      ORUN_EXEC_ID: env-${{ needs.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install orun
        run: go install ./cmd/orun

      - name: Download compiled plan
        uses: actions/download-artifact@v4
        with:
          name: orun-remote-state-plan
          path: examples/remote-state-matrix/.orun/objectmodel/

      - name: Run environment slice through remote state
        working-directory: examples/remote-state-matrix
        run: |
          orun run remote-state-e2e \
            --env '${{ matrix.env_name }}' \
            --remote-state \
            --backend-url "${ORUN_BACKEND_URL}" \
            --gha

  verify:
    name: Verify remote status and logs
    needs: [plan, run-one-job-per-runner, run-env-fanout]
    if: always()
    runs-on: ubuntu-latest
    env:
      ORUN_BACKEND_URL: ${{ vars.ORUN_BACKEND_URL }}
      ORUN_REMOTE_STATE: "true"
      ORUN_EXEC_ID: ${{ needs.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install orun
        run: go install ./cmd/orun

      - name: Download compiled plan
        uses: actions/download-artifact@v4
        with:
          name: orun-remote-state-plan
          path: examples/remote-state-matrix/.orun/objectmodel/

      - name: Verify remote status
        working-directory: examples/remote-state-matrix
        run: |
          orun status \
            --remote-state \
            --backend-url "${ORUN_BACKEND_URL}" \
            --exec-id "${ORUN_EXEC_ID}" \
            --json

      - name: Verify remote logs
        working-directory: examples/remote-state-matrix
        run: |
          orun logs \
            --remote-state \
            --backend-url "${ORUN_BACKEND_URL}" \
            --exec-id "${ORUN_EXEC_ID}" \
            --job '${{ needs.plan.outputs.first_job }}'

      - name: Assert all jobs succeeded
        working-directory: examples/remote-state-matrix
        run: |
          status_json="$(orun status \
            --remote-state \
            --backend-url "${ORUN_BACKEND_URL}" \
            --exec-id "${ORUN_EXEC_ID}" \
            --json)"
          echo "${status_json}" | jq .
          # Check that no jobs are in failed state
          failed="$(echo "${status_json}" | jq '[.state.jobs | to_entries[] | select(.value.status == "failed")] | length')"
          if [ "${failed}" -gt 0 ]; then
            echo "ERROR: ${failed} job(s) failed"
            exit 1
          fi
          echo "All jobs passed remote state verification."
