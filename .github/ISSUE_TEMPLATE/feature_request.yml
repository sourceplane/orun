name: Feature request
description: Propose a new capability or a change in behaviour.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Larger proposals usually become a spec under `specs/`; see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that orun makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should orun do? Include example commands, intent, or output where it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including workarounds you use today.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Compiler (plan, validate, debug, intent)
        - Runtime (run, runners, workflow)
        - Catalog and objects
        - Compositions and stacks
        - Scaffolding, blueprints, and baselines
        - Cloud client (auth, workspace, cloud, secrets, integrations, policy)
        - Agent runtime and MCP
        - Cockpit (status, logs, tui)
        - Documentation
        - Other
