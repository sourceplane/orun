# A task contract template. Name it tasks/<KEY>.TaskContract.yaml with the
# task's key — the tracker's issue key, or the one you chose in the epic's
# cluster code — and attach it: `task_create` with the contract inline (or
# `orun task create --contract`) for a task you mint, `orun task attach` for
# one the tracker minted. The file is the contract; it declares no task.
#
# `affects` is the ceiling on what the diff may touch (`orun task check --base
# main` compares). `gates: []` DECLARES that merge alone finishes the task; list
# check names here when a PR check must pass first.
apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: <one sentence: what is true when this task is done>
  affects:
    - <path>
    - <path>
  doneWhen:
    - <observable fact>
    - <observable fact>
  gates: []
