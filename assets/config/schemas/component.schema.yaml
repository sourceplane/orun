$schema: http://json-schema.org/draft-07/schema#
title: orun Component
description: External component manifest specification
type: object
required:
  - apiVersion
  - kind
  - metadata
  - spec
properties:
  apiVersion:
    type: string
    pattern: ^sourceplane\.io/v[0-9]+$
  kind:
    type: string
    enum:
      - Component
  metadata:
    type: object
    required:
      - name
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 63
  spec:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        minLength: 1
      domain:
        type: string
      enabled:
        type: boolean
        default: true
      path:
        type: string
      subscribe:
        type: object
        properties:
          environments:
            type: array
            items:
              type: string
      parameters:
        type: object
        additionalProperties: true
      overrides:
        type: object
        properties:
          steps:
            type: array
            items:
              type: object
              required:
                - name
                - run
              properties:
                name:
                  type: string
                phase:
                  type: string
                  enum:
                    - pre
                    - main
                    - post
                order:
                  type: integer
                  minimum: 0
                run:
                  type: string
                timeout:
                  type: string
                  pattern: ^[0-9]+(m|h|s)$
                retry:
                  type: integer
                  minimum: 0
                  maximum: 10
                onFailure:
                  type: string
                  enum:
                    - stop
                    - continue
      preview:
        type: object
        description: How the component runs itself for the live preview (`orun preview`).
        required:
          - run
          - port
        properties:
          run:
            type: array
            description: The dev server's argv, run from the component's directory.
            minItems: 1
            items:
              type: string
          port:
            type: integer
            description: Where the server answers on 127.0.0.1.
            minimum: 1024
            maximum: 65535
          needs:
            type: array
            description: Components whose own previews start first.
            items:
              type: string
          path:
            type: string
            description: The page the preview opens (default /).
            pattern: ^/
          env:
            type: object
            description: Plain, non-secret env for the server.
            additionalProperties:
              type: string
        additionalProperties: false
      labels:
        type: object
        additionalProperties:
          type: string
      dependsOn:
        type: array
        items:
          type: object
          required:
            - component
          properties:
            component:
              type: string
            environment:
              type: string
            scope:
              type: string
              enum:
                - same-environment
                - cross-environment
            condition:
              type: string
              enum:
                - success
                - always
                - failure